<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高级计算器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3B82F6',
                        secondary: '#10B981',
                        accent: '#8B5CF6',
                        dark: '#1E293B',
                        'dark-light': '#334155',
                        'light-gray': '#94A3B8',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .calculator-shadow {
                box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            }
            .btn-hover {
                transition: all 0.2s ease;
            }
            .btn-hover:hover {
                transform: translateY(-2px);
            }
            .btn-active {
                transform: translateY(0);
            }
            .result-animate {
                transition: all 0.3s ease;
            }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 to-slate-800 min-h-screen flex items-center justify-center p-4 font-sans">
    <div class="calculator-container max-w-md w-full mx-auto">
        <!-- 计算器主体 -->
        <div class="calculator bg-dark rounded-2xl overflow-hidden calculator-shadow transition-all duration-300 hover:calculator-shadow/80">
            <!-- 计算器头部 -->
            <div class="calculator-header p-4 bg-dark-light flex justify-between items-center">
                <h1 class="text-xl font-bold text-white">高级计算器</h1>
                <div class="theme-toggle flex space-x-2">
                    <button id="historyBtn" class="text-light-gray hover:text-white transition-colors duration-200">
                        <i class="fa fa-history"></i>
                    </button>
                    <button id="themeBtn" class="text-light-gray hover:text-white transition-colors duration-200">
                        <i class="fa fa-moon-o"></i>
                    </button>
                </div>
            </div>
            
            <!-- 历史记录面板 -->
            <div id="historyPanel" class="history-panel bg-dark-light/95 p-4 max-h-48 overflow-y-auto hidden">
                <h3 class="text-white font-medium mb-2">计算历史</h3>
                <div id="historyList" class="text-light-gray space-y-1 text-sm"></div>
                <button id="clearHistory" class="mt-2 text-xs text-primary hover:text-primary/80 transition-colors">
                    清空历史
                </button>
            </div>
            
            <!-- 计算器显示屏 -->
            <div class="calculator-display p-4 bg-dark-light">
                <div id="expression" class="text-right text-light-gray text-lg min-h-8"></div>
                <div id="result" class="text-right text-white text-4xl font-bold min-h-14 result-animate"></div>
            </div>
            
            <!-- 计算器按键 -->
            <div class="calculator-keys grid grid-cols-4 gap-2 p-4">
                <!-- 第一行 -->
                <button class="key bg-dark-light text-light-gray hover:bg-slate-700 btn-hover rounded-xl py-4 px-2 text-xl font-medium" data-value="C">
                    C
                </button>
                <button class="key bg-dark-light text-light-gray hover:bg-slate-700 btn-hover rounded-xl py-4 px-2 text-xl font-medium" data-value="+/-">
                    +/-
                </button>
                <button class="key bg-dark-light text-light-gray hover:bg-slate-700 btn-hover rounded-xl py-4 px-2 text-xl font-medium" data-value="%">
                    %
                </button>
                <button class="key bg-accent text-white hover:bg-accent/80 btn-hover rounded-xl py-4 px-2 text-xl font-medium" data-value="/">
                    ÷
                </button>
                
                <!-- 第二行 -->
                <button class="key bg-dark text-white hover:bg-slate-800 btn-hover rounded-xl py-4 px-2 text-xl font-medium" data-value="7">
                    7
                </button>
                <button class="key bg-dark text-white hover:bg-slate-800 btn-hover rounded-xl py-4 px-2 text-xl font-medium" data-value="8">
                    8
                </button>
                <button class="key bg-dark text-white hover:bg-slate-800 btn-hover rounded-xl py-4 px-2 text-xl font-medium" data-value="9">
                    9
                </button>
                <button class="key bg-accent text-white hover:bg-accent/80 btn-hover rounded-xl py-4 px-2 text-xl font-medium" data-value="*">
                    ×
                </button>
                
                <!-- 第三行 -->
                <button class="key bg-dark text-white hover:bg-slate-800 btn-hover rounded-xl py-4 px-2 text-xl font-medium" data-value="4">
                    4
                </button>
                <button class="key bg-dark text-white hover:bg-slate-800 btn-hover rounded-xl py-4 px-2 text-xl font-medium" data-value="5">
                    5
                </button>
                <button class="key bg-dark text-white hover:bg-slate-800 btn-hover rounded-xl py-4 px-2 text-xl font-medium" data-value="6">
                    6
                </button>
                <button class="key bg-accent text-white hover:bg-accent/80 btn-hover rounded-xl py-4 px-2 text-xl font-medium" data-value="-">
                    -
                </button>
                
                <!-- 第四行 -->
                <button class="key bg-dark text-white hover:bg-slate-800 btn-hover rounded-xl py-4 px-2 text-xl font-medium" data-value="1">
                    1
                </button>
                <button class="key bg-dark text-white hover:bg-slate-800 btn-hover rounded-xl py-4 px-2 text-xl font-medium" data-value="2">
                    2
                </button>
                <button class="key bg-dark text-white hover:bg-slate-800 btn-hover rounded-xl py-4 px-2 text-xl font-medium" data-value="3">
                    3
                </button>
                <button class="key bg-accent text-white hover:bg-accent/80 btn-hover rounded-xl py-4 px-2 text-xl font-medium" data-value="+">
                    +
                </button>
                
                <!-- 第五行 -->
                <button class="key bg-dark text-white hover:bg-slate-800 btn-hover rounded-xl py-4 px-2 text-xl font-medium col-span-2" data-value="0">
                    0
                </button>
                <button class="key bg-dark text-white hover:bg-slate-800 btn-hover rounded-xl py-4 px-2 text-xl font-medium" data-value=".">
                    .
                </button>
                <button class="key bg-secondary text-white hover:bg-secondary/80 btn-hover rounded-xl py-4 px-2 text-xl font-medium" data-value="=">
                    =
                </button>
            </div>
        </div>
        
        <!-- 页脚 -->
        <div class="text-center text-light-gray/50 text-xs mt-4">
            <p>高级计算器 &copy; 2025</p>
        </div>
    </div>

    <script>
        // 获取DOM元素
        const keys = document.querySelectorAll('.key');
        const expressionDisplay = document.getElementById('expression');
        const resultDisplay = document.getElementById('result');
        const historyPanel = document.getElementById('historyPanel');
        const historyList = document.getElementById('historyList');
        const historyBtn = document.getElementById('historyBtn');
        const clearHistoryBtn = document.getElementById('clearHistory');
        const themeBtn = document.getElementById('themeBtn');
        const calculator = document.querySelector('.calculator');
        
        // 初始化变量
        let currentExpression = '';
        let currentResult = '';
        let isNewCalculation = false;
        let history = [];
        
        // 加载历史记录
        function loadHistory() {
            const savedHistory = localStorage.getItem('calculatorHistory');
            if (savedHistory) {
                history = JSON.parse(savedHistory);
                renderHistory();
            }
        }
        
        // 保存历史记录
        function saveHistory() {
            localStorage.setItem('calculatorHistory', JSON.stringify(history));
        }
        
        // 渲染历史记录
        function renderHistory() {
            historyList.innerHTML = '';
            if (history.length === 0) {
                historyList.innerHTML = '<div class="text-center">暂无历史记录</div>';
                return;
            }
            
            history.forEach((item, index) => {
                const historyItem = document.createElement('div');
                historyItem.className = 'p-1 hover:bg-slate-700/50 rounded cursor-pointer transition-colors';
                historyItem.innerHTML = `
                    <div>${item.expression}</div>
                    <div class="text-right font-medium">${item.result}</div>
                `;
                historyItem.addEventListener('click', () => {
                    currentExpression = item.expression;
                    updateDisplay();
                    historyPanel.classList.add('hidden');
                });
                historyList.appendChild(historyItem);
            });
        }
        
        // 添加到历史记录
        function addToHistory(expression, result) {
            history.unshift({ expression, result });
            if (history.length > 10) {
                history.pop();
            }
            saveHistory();
            renderHistory();
        }
        
        // 更新显示
        function updateDisplay() {
            expressionDisplay.textContent = currentExpression || '0';
            
            // 添加千位分隔符
            if (currentResult !== '' && !isNaN(parseFloat(currentResult))) {
                const resultNum = parseFloat(currentResult);
                const formattedResult = resultNum.toLocaleString('zh-CN', {
                    maximumFractionDigits: 10,
                    useGrouping: true
                });
                resultDisplay.textContent = formattedResult;
            } else {
                resultDisplay.textContent = currentResult || '0';
            }
        }
        
        // 计算表达式
        function calculate() {
            try {
                // 替换特殊符号
                let expression = currentExpression.replace(/×/g, '*').replace(/÷/g, '/');
                
                // 计算结果
                const result = Function(`'use strict'; return (${expression})`)();
                
                // 格式化结果
                let formattedResult = result.toString();
                
                // 如果是整数，去掉小数点
                if (Number.isInteger(result)) {
                    formattedResult = result.toString();
                } else {
                    // 限制小数位数
                    formattedResult = result.toFixed(10).replace(/\.?0+$/, '');
                }
                
                // 添加到历史记录
                addToHistory(currentExpression, formattedResult);
                
                return formattedResult;
            } catch (error) {
                return '错误';
            }
        }
        
        // 处理按键点击
        function handleKeyClick(event) {
            const key = event.target;
            const value = key.dataset.value;
            
            // 防止非按键元素触发
            if (!value) return;
            
            // 添加点击动画
            key.classList.add('btn-active');
            setTimeout(() => {
                key.classList.remove('btn-active');
            }, 100);
            
            // 处理不同按键
            switch (value) {
                case 'C':
                    // 清除所有
                    currentExpression = '';
                    currentResult = '';
                    isNewCalculation = false;
                    break;
                case '+/-':
                    // 正负号切换
                    if (currentResult) {
                        currentResult = (-parseFloat(currentResult)).toString();
                    } else if (currentExpression) {
                        // 如果表达式以数字开头，切换其符号
                        const match = currentExpression.match(/^-?\d+(\.\d+)?/);
                        if (match) {
                            const num = parseFloat(match[0]);
                            const newNum = (-num).toString();
                            currentExpression = currentExpression.replace(/^-?\d+(\.\d+)?/, newNum);
                        }
                    }
                    break;
                case '%':
                    // 百分比
                    if (currentResult) {
                        currentResult = (parseFloat(currentResult) / 100).toString();
                    } else if (currentExpression) {
                        const lastNumber = currentExpression.match(/(-?\d+(\.\d+)?)$/);
                        if (lastNumber) {
                            const num = parseFloat(lastNumber[0]) / 100;
                            currentExpression = currentExpression.replace(/(-?\d+(\.\d+)?)$/, num.toString());
                        }
                    }
                    break;
                case '=':
                    // 计算结果
                    if (currentExpression) {
                        currentResult = calculate();
                        currentExpression = '';
                        isNewCalculation = true;
                    }
                    break;
                default:
                    // 处理数字和运算符
                    if (isNewCalculation) {
                        // 如果是新计算，清空表达式
                        if (/^[0-9.]$/.test(value)) {
                            currentExpression = value;
                        } else {
                            currentExpression = currentResult + value;
                        }
                        currentResult = '';
                        isNewCalculation = false;
                    } else {
                        // 追加到表达式
                        currentExpression += value;
                    }
            }
            
            // 更新显示
            updateDisplay();
        }
        
        // 处理键盘输入
        function handleKeyPress(event) {
            // 数字键
            if (event.key >= '0' && event.key <= '9') {
                document.querySelector(`[data-value="${event.key}"]`).click();
            }
            
            // 运算符
            if (['+', '-', '*', '/', '.'].includes(event.key)) {
                let value = event.key;
                if (value === '*') value = '×';
                if (value === '/') value = '÷';
                document.querySelector(`[data-value="${value}"]`).click();
            }
            
            // 特殊键
            if (event.key === 'Enter' || event.key === '=') {
                document.querySelector(`[data-value="="]`).click();
            }
            if (event.key === 'Escape') {
                document.querySelector(`[data-value="C"]`).click();
            }
            if (event.key === '%') {
                document.querySelector(`[data-value="%"]`).click();
            }
            if (event.key === 'Backspace') {
                // 退格
                currentExpression = currentExpression.slice(0, -1);
                updateDisplay();
            }
        }
        
        // 切换历史面板
        function toggleHistoryPanel() {
            historyPanel.classList.toggle('hidden');
            renderHistory();
        }
        
        // 清空历史记录
        function clearHistory() {
            history = [];
            saveHistory();
            renderHistory();
        }
        
        // 切换主题
        function toggleTheme() {
            // 这里可以实现主题切换功能
            const isDark = calculator.classList.contains('bg-dark');
            if (isDark) {
                calculator.classList.remove('bg-dark', 'bg-dark-light');
                calculator.classList.add('bg-white');
                document.querySelectorAll('.calculator-header, .calculator-display').forEach(el => {
                    el.classList.remove('bg-dark-light');
                    el.classList.add('bg-gray-100');
                });
                document.querySelectorAll('.key.bg-dark, .key.bg-dark-light').forEach(el => {
                    el.classList.remove('bg-dark', 'bg-dark-light', 'hover:bg-slate-800', 'hover:bg-slate-700');
                    el.classList.add('bg-gray-200', 'hover:bg-gray-300');
                });
                document.querySelectorAll('.text-white, .text-light-gray').forEach(el => {
                    el.classList.remove('text-white', 'text-light-gray');
                    el.classList.add('text-gray-800');
                });
                themeBtn.innerHTML = '<i class="fa fa-sun-o"></i>';
            } else {
                calculator.classList.remove('bg-white');
                calculator.classList.add('bg-dark');
                document.querySelectorAll('.calculator-header, .calculator-display').forEach(el => {
                    el.classList.remove('bg-gray-100');
                    el.classList.add('bg-dark-light');
                });
                document.querySelectorAll('.key.bg-gray-200').forEach(el => {
                    el.classList.remove('bg-gray-200', 'hover:bg-gray-300');
                    el.classList.add('bg-dark', 'hover:bg-slate-800');
                });
                document.querySelectorAll('.key.bg-gray-200').forEach(el => {
                    el.classList.remove('bg-gray-200', 'hover:bg-gray-300');
                    el.classList.add('bg-dark-light', 'hover:bg-slate-700');
                });
                document.querySelectorAll('.text-gray-800').forEach(el => {
                    el.classList.remove('text-gray-800');
                    el.classList.add('text-white');
                });
                document.querySelectorAll('.calculator-header .text-gray-800, .calculator-display .text-gray-800').forEach(el => {
                    el.classList.remove('text-gray-800');
                    el.classList.add('text-light-gray');
                });
                document.querySelectorAll('.calculator-display .font-bold.text-gray-800').forEach(el => {
                    el.classList.remove('text-gray-800');
                    el.classList.add('text-white');
                });
                themeBtn.innerHTML = '<i class="fa fa-moon-o"></i>';
            }
        }
        
        // 绑定事件
        keys.forEach(key => {
            key.addEventListener('click', handleKeyClick);
        });
        
        window.addEventListener('keydown', handleKeyPress);
        historyBtn.addEventListener('click', toggleHistoryPanel);
        clearHistoryBtn.addEventListener('click', clearHistory);
        themeBtn.addEventListener('click', toggleTheme);
        
        // 初始化
        loadHistory();
        updateDisplay();
    </script>
</body>
</html>
